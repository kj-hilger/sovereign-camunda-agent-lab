# Up-to-date image with ARM64 / Jetson CUDA support
image:
  repository: ollama/ollama
  tag: "0.5.11"
  pullPolicy: IfNotPresent

# Resources tailored specifically for Jetson Orin Nano (Unified/Shared Memory)
resources:
  requests:
    cpu: 2000m
    memory: 4000Mi
  limits:
    nvidia.com/gpu: "1"
    cpu: 4000m
    memory: 6000Mi

# Ollama runtime tuning for edge devices
env:
  # Restricts KV-cache memory growth by enforcing single-request handling
  - name: OLLAMA_NUM_PARALLEL
    value: "1"
  # Prevents repeated unloading/reloading from flash storage
  - name: OLLAMA_KEEP_ALIVE
    value: "24h"
  # Enable Flash Attention (ToDo: check logs if GPU supports it)
  - name: OLLAMA_FLASH_ATTENTION
    value: "1"
  # Quantize KV cache to save memory
  - name: OLLAMA_KV_CACHE_TYPE
    value: "q8_0"
  # Log Level
  - name: OLLAMA_DEBUG
    value: "1"

# Jetson / L4T GPU Support
nvidiaRuntime:
  enabled: true

# Lightweight model selected for fast response times on Jetson
models:
  - qwen2.5:3b