  image:
    repository: postgres
    tag: "18.11"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  storage:
    size: 10Gi

  global:
    postgresql:
      image:
        tag: "18.11"
        registry: docker.io

  postgresql:
    auth:
      enabled: true

    persistence:
      size: 10Gi

  primary:
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30

  imagePullPolicy: IfNotPresent
