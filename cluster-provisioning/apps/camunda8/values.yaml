image:
  repository: camunda/camunda-platform
  tag: "8.9.14"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 3000m
    memory: 2500Mi
  requests:
    cpu: 1250m
    memory: 1000Mi

camunda-platform:
  global:
    image:
      tag: "8.9.14"
    security:
      unprotectedAPI: true

  orchestration:
    clusterSize: "1"
    partitionCount: "1"
    replicationFactor: "1"
    exporters:
      camunda:
        enabled: false
      rdbms:
        enabled: true
    data:
      secondaryStorage:
        type: rdbms
    resources:
      limits:
        cpu: "2500m"
        memory: "1500Mi"
      requests:
        cpu: "750m"
        memory: "1000Mi"
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xms512m -Xmx1536m -XX:+UseG1GC"
      - name: CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTED_API
        value: "true"

  identity:
    enabled: false

  optimize:
    enabled: false

  connectors:
    enabled: true
    resources:
      limits:
        cpu: "1000m"
        memory: "384Mi"
      requests:
        cpu: "300m"
        memory: "192Mi"
    env:
      - name: CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTED_API
        value: "true"
      - name: CAMUNDA_CLIENT_MODE
        value: self-managed
      - name: CAMUNDA_CLIENT_GRPCADDRESS
        value: "http://camunda8-zeebe-gateway.camunda.svc.cluster.local:26500"
      - name: CAMUNDA_CLIENT_RESTADDRESS
        value: "http://camunda8-zeebe-gateway.camunda.svc.cluster.local:8080"
      - name: CAMUNDA_CLIENT_WORKER_DEFAULTS_STREAMENABLED
        value: "false"
      - name: ZEEBE_CLIENT_WORKER_DEFAULTS_STREAM_ENABLED
        value: "false"
      - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
        value: "true"